name: checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Match a default Git for Windows install (line-ending conversion on)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: Repo tests
        run: sh tests/run.sh
      - name: Upload tests with fake transport
        run: sh tests/upload.sh
